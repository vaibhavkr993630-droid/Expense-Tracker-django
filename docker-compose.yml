# Local, production-like stack: PostgreSQL + the Django API.
#   cp .env.example .env     (then edit DJANGO_SECRET_KEY)
#   docker compose up --build
# API: http://localhost:8000   docs: /api/docs   admin: /admin/   (change the port with WEB_PORT in .env)

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expense_tracker
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expense}
    volumes:
      - pgdata:/var/lib/postgresql/data  # named volume: data survives `docker compose down`
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"  # localhost only; lets you run the tests against this database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U expense -d expense_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy  # wait until Postgres accepts connections, not just until it started
    env_file:
      - path: .env  # optional: email settings, CORS origins, ...
        required: false
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env (see .env.example)}
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://expense:${POSTGRES_PASSWORD:-expense}@db:5432/expense_tracker
      USE_HTTPS: "false"  # plain http on localhost; keep it true when deployed behind HTTPS
    ports:
      - "127.0.0.1:${WEB_PORT:-8000}:8000"  # set WEB_PORT in .env if 8000 is already taken
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/healthy')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:

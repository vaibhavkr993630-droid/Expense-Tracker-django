[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["legacy_fastapi_reference", "frontend", "migrations"]

[tool.ruff.lint]
# E/F = pycodestyle + pyflakes, I = import sorting, B = bugbear, DJ = flake8-django
select = ["E", "F", "I", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
testpaths = ["apps", "config"]

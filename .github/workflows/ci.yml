name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to read the repository.
permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (Python 3.12, PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: expense_tracker
          POSTGRES_USER: expense
          POSTGRES_PASSWORD: expense
        ports:
          - 5432:5432
        # Wait until the database accepts connections before the steps start.
        options: >-
          --health-cmd "pg_isready -U expense -d expense_tracker"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://expense:expense@localhost:5432/expense_tracker
      # A throw-away value used only inside this job (never a real secret).
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-jwt-signing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Django system check
        run: python manage.py check
      - name: Production settings check
        run: python manage.py check --deploy --fail-level ERROR
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_ALLOWED_HOSTS: example.com
      - name: Models and migrations are in sync
        run: python manage.py makemigrations --check --dry-run
      # The suite includes a test that generates the OpenAPI schema and fails on any warning.
      - name: Run tests
        run: pytest -q

  docker:
    name: Docker image builds and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image and start the stack
        run: docker compose up -d --build --wait --wait-timeout 180
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-jwt-signing
      - name: Health check
        run: curl --fail --silent --show-error http://localhost:8000/healthy
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs
        env:
          DJANGO_SECRET_KEY: unused
      - name: Stop the stack
        if: always()
        run: docker compose down -v
        env:
          DJANGO_SECRET_KEY: unused
